<script>
const Q=[{"no":1,"category":"消防関係法令","question":"乙6の対象はどれか。","choices":{"A":"自動火災報知設備","B":"消火器","C":"屋内消火栓設備","D":"避難器具"},"answer":"B","explanation":"乙6は主として消火器を対象とする。"},{"no":2,"category":"消防関係法令","question":"消防用設備等の維持管理で正しいものはどれか。","choices":{"A":"設置後は不要","B":"火災時に機能するよう適正に維持する","C":"外観だけ良ければよい","D":"故障してもよい"},"answer":"B","explanation":"火災時に所定の機能を発揮できるよう維持する。"},{"no":3,"category":"消防関係法令","question":"消火器の設置場所として適切なのはどれか。","choices":{"A":"物置の奥","B":"施錠した倉庫","C":"容易に発見・使用できる場所","D":"床下"},"answer":"C","explanation":"緊急時に容易に発見・到達・使用できることが重要。"},{"no":4,"category":"消防関係法令","question":"消火器を移設した場合に確認することはどれか。","choices":{"A":"見た目だけ","B":"移設後も設置基準を満たすこと","C":"必ず屋外にする","D":"表示を外す"},"answer":"B","explanation":"移設後も必要な設置基準を満たす必要がある。"},{"no":5,"category":"消防関係法令","question":"消防設備士免状について正しいものはどれか。","choices":{"A":"類別はない","B":"免状の種類に応じた業務範囲がある","C":"自由に貸借できる","D":"業務範囲と無関係"},"answer":"B","explanation":"免状の種類・類に応じて扱える設備等の範囲が定められる。"},{"no":6,"category":"消防関係法令","question":"点検の主な目的はどれか。","choices":{"A":"外観を整える","B":"火災時に正常に機能することを確認する","C":"電気料金を下げる","D":"建物を装飾する"},"answer":"B","explanation":"点検は機能・状態を確認し維持管理に役立てる。"},{"no":7,"category":"消防関係法令","question":"消火器の周囲に物品を置くことについて正しいものはどれか。","choices":{"A":"問題ない","B":"夜間だけならよい","C":"使用の障害となるため不適切","D":"表示があればよい"},"answer":"C","explanation":"迅速な取り出しを妨げる状態は避ける。"},{"no":8,"category":"消防関係法令","question":"表示が汚れて読みにくい消火器への対応はどれか。","choices":{"A":"放置","B":"必要な表示を確認できる状態にする","C":"表示を全部外す","D":"別の紙で隠す"},"answer":"B","explanation":"必要な表示は確認できる状態に維持する。"},{"no":9,"category":"消防関係法令","question":"点検で異常を発見した場合の対応はどれか。","choices":{"A":"そのまま再設置","B":"放置","C":"必要な整備・交換等を行う","D":"表示だけ交換"},"answer":"C","explanation":"異常を放置せず必要な措置を行う。"},{"no":10,"category":"消防関係法令","question":"防火対象物の用途が変更された場合に確認することはどれか。","choices":{"A":"用途は無関係","B":"新しい用途に応じた設置状況","C":"色だけ","D":"メーカー名だけ"},"answer":"B","explanation":"用途等に応じた設置基準を確認する。"},{"no":11,"category":"消防関係法令","question":"消火器の設置基準に関係するものはどれか。","choices":{"A":"用途や規模等","B":"所有者の趣味","C":"天気だけ","D":"壁紙"},"answer":"A","explanation":"防火対象物の用途・規模等が関係する。"},{"no":12,"category":"消防関係法令","question":"点検結果を記録する意義はどれか。","choices":{"A":"記録不要","B":"状態・整備履歴の把握に役立つ","C":"広告用だけ","D":"電力測定用"},"answer":"B","explanation":"維持管理に点検・整備履歴を活用できる。"},{"no":13,"category":"消防関係法令","question":"消火器の標識について正しいものはどれか。","choices":{"A":"見えなくてもよい","B":"設置位置を容易に確認できるようにする","C":"床下に置く","D":"文字を極端に小さくする"},"answer":"B","explanation":"緊急時に設置位置を確認できることが重要。"},{"no":14,"category":"消防関係法令","question":"廊下に消火器を設置するとき重要なのはどれか。","choices":{"A":"通行を妨げてもよい","B":"避難・通行を妨げず使用しやすいこと","C":"必ず高所","D":"暗所"},"answer":"B","explanation":"避難・通行を妨げず容易に使用できることが重要。"},{"no":15,"category":"消防関係法令","question":"消防法令の目的として適切なのはどれか。","choices":{"A":"火災による被害の防止・軽減","B":"建物の装飾","C":"電気料金の決定","D":"商品の価格決定"},"answer":"A","explanation":"火災の予防等により生命・財産を守る。"},{"no":16,"category":"消防関係法令","question":"消防設備士が整備を行う際に守ることはどれか。","choices":{"A":"資格範囲を無視","B":"免状に応じた範囲で行う","C":"誰でも同じ範囲","D":"資格不要"},"answer":"B","explanation":"免状の種類に応じた業務範囲を守る。"},{"no":17,"category":"消防関係法令","question":"設置後の消火器について正しいものはどれか。","choices":{"A":"設置時点で終了","B":"良好な状態を維持する","C":"故障しても期限まで放置","D":"表示を外す"},"answer":"B","explanation":"設置後も適正な維持管理が必要。"},{"no":18,"category":"消防関係法令","question":"表示がカバーで隠れている場合はどうするか。","choices":{"A":"そのまま","B":"表示が確認できるよう改善","C":"表示を削る","D":"別設備で隠す"},"answer":"B","explanation":"必要な表示を確認できるようにする。"},{"no":19,"category":"消防関係法令","question":"圧力計の異常が疑われる場合はどうするか。","choices":{"A":"必ず正常","B":"放置","C":"必要な確認・整備","D":"圧力計を隠す"},"answer":"C","explanation":"圧力異常は機能・安全性に関係する。"},{"no":20,"category":"消防関係法令","question":"設置場所を選ぶ際に重要なのはどれか。","choices":{"A":"見つけにくさ","B":"発見・到達・使用の容易さ","C":"重量だけ","D":"価格だけ"},"answer":"B","explanation":"緊急時に迅速に使用できることが重要。"},{"no":21,"category":"消防関係法令","question":"周囲を整理しておく理由はどれか。","choices":{"A":"見た目だけ","B":"迅速な発見・取り出しのため","C":"温度を上げるため","D":"圧力を下げるため"},"answer":"B","explanation":"障害物をなくし迅速に使用できるようにする。"},{"no":22,"category":"消防関係法令","question":"「機能を維持する」とはどれか。","choices":{"A":"火災時に所定の性能を発揮できる状態","B":"新品に見える状態だけ","C":"塗装がきれいな状態","D":"重い状態"},"answe 抜かれた・操作された可能性","B":"室温","C":"床の色","D":"広告"},"answer":"A","explanation":"封印切れの原因として操作・使用の有無を確認する。"},{"no":91,"category":"実技・鑑別","question":"ホースに深い亀裂がある。措置はどれか。","choices":{"A":"交換等の整備","B":"そのまま使用","C":"テープで隠すだけ","D":"水洗いだけ"},"answer":"A","explanation":"損傷ホースは交換等の整備が必要。"},{"no":92,"category":"実技・鑑別","question":"ノズル先端が閉塞している。何が起こるか。","choices":{"A":"正常放射できない","B":"必ず圧力上昇","C":"薬剤増加","D":"容器軽量化"},"answer":"A","explanation":"閉塞は放射不良の原因になる。"},{"no":93,"category":"実技・鑑別","question":"容器表面に著しい腐食がある。注意すべきことはどれか。","choices":{"A":"容器強度・耐圧性能","B":"色","C":"音","D":"文字フォント"},"answer":"A","explanation":"腐食は容器強度・安全性に影響する可能性がある。"},{"no":94,"category":"実技・鑑別","question":"図E：消火器が転倒している。最初に確認することはどれか。","choices":{"A":"設置・固定状態","B":"テレビ","C":"床の色","D":"照明"},"answer":"A","explanation":"転倒防止を含む設置状態を確認する。"},{"no":95,"category":"実技・鑑別","question":"図F：表示板の文字が判読しにくい。対応はどれか。","choices":{"A":"必要な表示を復旧する","B":"表示を削る","C":"放置","D":"別紙で隠す"},"answer":"A","explanation":"必要な表示を確認できる状態にする。"},{"no":96,"category":"実技・鑑別","question":"粉末薬剤が固まっている。問題はどれか。","choices":{"A":"正常に放出できない可能性","B":"放射量増加","C":"圧力一定","D":"容器軽量化"},"answer":"A","explanation":"固化・凝集は放出不良につながる可能性がある。"},{"no":97,"category":"実技・鑑別","question":"放射操作用レバーが固着している。問題点はどれか。","choices":{"A":"緊急時に操作できないおそれ","B":"薬剤増加","C":"圧力必ず低下","D":"容器冷却"},"answer":"A","explanation":"操作部固着は使用不能につながる。"},{"no":98,"category":"実技・鑑別","question":"銘板を確認する主な目的はどれか。","choices":{"A":"型式・仕様等の確認","B":"床面積測定","C":"室温測定","D":"電流測定"},"answer":"A","explanation":"銘板には型式・薬剤量等の仕様情報がある。"},{"no":99,"category":"実技・鑑別","question":"整備後に再設置する際の確認はどれか。","choices":{"A":"安全栓・封印・表示・外観等","B":"テレビ音量","C":"壁紙","D":"照明色"},"answer":"A","explanation":"整備後は使用可能な状態に復旧していることを確認する。"},{"no":100,"category":"実技・鑑別","question":"消火器の設置状態を鑑別するとき、特に確認すべき組合せはどれか。","choices":{"A":"転倒・障害物・表示の状態","B":"壁紙・照明色・床模様","C":"テレビ・家具・時計","D":"室温・湿度・騒音"},"answer":"A","explanation":"転倒、使用を妨げる障害物、表示の状態などを確認する。"}],QUOTA={"消防関係法令":17,"基礎的知識（機械）":8,"構造・機能及び整備":17,"実技・鑑別":8},CATS=Object.keys(QUOTA);let exam=[],idx=0,answers={},wrong=[];
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function makeExam(){exam=[];CATS.forEach(c=>exam.push(...shuffle(Q.filter(x=>x.category===c)).slice(0,QUOTA[c])));exam=shuffle(exam);idx=0;answers={};wrong=[];show("quiz");render()}
function dogSvg(face,pink){let fur=pink?"#e99ab9":"#d8894c";let mouth=face==="happy"?"<path d='M35 49Q41 57 47 49Q41 62 35 49' fill='#e96b7e'/>":face==="sad"?"<path d='M35 56Q41 49 47 56' stroke='#fff' stroke-width='3' fill='none'/>":"<path d='M37 50Q41 53 45 50' stroke='#fff' stroke-width='3' fill='none'/>";return `<svg viewBox='0 0 82 82'><path d='M17 30L12 9L29 20Q41 15 53 20L70 9L65 31Q70 42 64 57Q56 72 41 72Q26 72 18 57Q12 42 17 30Z' fill='${fur}' stroke='#5a453e' stroke-width='2'/><path d='M22 31Q41 20 60 31L57 57Q41 70 25 57Z' fill='#fff3df'/><circle cx='30' cy='39' r='3' fill='#2b2320'/><circle cx='52' cy='39' r='3' fill='#2b2320/><path d='M37 46Q41 43 45 46Q41 51 37 46' fill='#2b2320'/>${mouth}<path d='M18 62Q41 78 64 62' fill='none' stroke='#4d77a8' stroke-width='6'/></svg>`}
function setDog(f){document.getElementById("dog").innerHTML=dogSvg(f,false)}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function render(){let x=exam[idx],a=answers[x.no];document.getElementById("counter").textContent=`第${idx+1}問 / 50`;document.getElementById("pct").textContent=Math.round((idx+1)/50*100)+"%";document.getElementById("bar").style.width=((idx+1)/50*100)+"%";document.getElementById("cat").textContent=x.category;document.getElementById("question").textContent=x.question;let box=document.getElementById("choices");box.innerHTML="";["A","B","C","D"].forEach(l=>{let b=document.createElement("button");b.className=`choice ${l.toLowerCase()}`;b.innerHTML=`<span class='letter'>${l}</span><span>${x.choices[l]}</span>`;if(a){b.classList.add("disabled");if(l===x.answer)b.classList.add("correct");if(l===a&&a!==x.answer)b.classList.add("wrong")}b.onclick=()=>answer(l);box.appendChild(b)});let r=document.getElementById("result"),e=document.getElementById("explain");if(a){let ok=a===x.answer;r.className="result show "+(ok?"ok":"ng");r.textContent=ok?"🎉 正解！ わんぱく黒柴君も大よろこび！":"💦 不正解。柴犬先生と正解を確認しよう！";e.classList.add("show");document.getElementById("explanation").textContent=x.explanation;setDog(ok?"happy":"sad");document.getElementById("speech").innerHTML=ok?"やったワン！正解だよ！🎉<small>この調子で次へ！</small>":"おしいワン！🐕‍🦺<small>正解を覚えて次へ！</small>"}else{r.className="result";e.classList.remove("show");setDog("think");document.getElementById("speech").innerHTML="柴犬先生です。よく読んで考えよう！🤔<small>黒柴君も回答を待ってるワン！</small>"}stats()}
function answer(l){let x=exam[idx];if(answers[x.no])return;answers[x.no]=l;if(l!==x.answer&&!wrong.includes(x.no))wrong.push(x.no);render()}
function stats(){let done=Object.keys(answers).length,c=exam.filter(x=>answers[x.no]===x.answer).length,w=done-c;document.getElementById("correct").textContent=c;document.getElementById("wrong").textContent=w;document.getElementById("rate").textContent=done?Math.round(c/done*100)+"%":"—";CATS.forEach((cat,i)=>{let a=exam.filter(x=>x.category===cat),d=a.filter(x=>answers[x.no]),cc=a.filter(x=>answers[x.no]===x.answer);document.getElementById("s"+(i+1)).textContent=d.length?Math.round(cc.length/d.length*100)+"%":"—"});if(done===50)finish()}
function finish(){let c=exam.filter(x=>answers[x.no]===x.answer).length,okAll=true,out="";CATS.forEach((cat,i)=>{let a=exam.filter(x=>x.category===cat),cc=a.filter(x=>answers[x.no]===x.answer).length,p=Math.round(cc/a.length*100),ok=p>=60;okAll=okAll&&ok;out+=`<div class='sec s${i+1}'><span>${cat}</span><b>${cc}/${a.length}</b><b>${p}% ${ok?"○":"×"}</b></div>`});let pass=c>=30&&okAll;document.getElementById("fc").textContent=c;document.getElementById("fw").textContent=50-c;document.getElementById("fr").textContent=Math.round(c/50*100)+"%";document.getElementById("secResult").innerHTML=out;document.getElementById("scoreCard").className="card big "+(pass?"pass":"fail");document.getElementById("title").textContent=pass?"🌸 合格おめでとう！":"📚 今回は不合格";document.getElementById("scoreDog").innerHTML=dogSvg(pass?"happy":"sad",pass);document.getElementById("msg").textContent=pass?"🎀 ピンク柴の妹より「おめでとう！4つの区分を全部クリアしたよ！」":"全体が60%以上でも、1区分でも60%未満なら不合格です。60%未満の区分を重点復習しましょう。";show("score")}
document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render()}};document.getElementById("next").onclick=()=>{if(idx<49){idx++;render()}else finish()};document.getElementById("new").onclick=()=>{if(confirm("新しい50問に入れ替えますか？"))makeExam()};document.getElementById("again").onclick=makeExam;document.getElementById("review").onclick=()=>{let b=document.getElementById("reviewList");b.innerHTML="";document.getElementById("reviewInfo").textContent=wrong.length?wrong.length+"問を復習できます。":"まだ間違えた問題はありません。";wrong.forEach(no=>{let i=exam.findIndex(x=>x.no===no),x=exam[i],d=document.createElement("div");d.className="item";d.innerHTML=`<span>第${i+1}問　${x.question.slice(0,45)}${x.question.length>45?"…":""}</span><button>復習</button>`;d.onclick=()=>{idx=i;show("quiz");render()};b.appendChild(d)});show("reviews")};document.getElementById("back").onclick=()=>show("quiz");makeExam();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
